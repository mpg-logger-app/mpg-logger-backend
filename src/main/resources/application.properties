spring.application.name=mpg-logger-backend

# Data is saved to a file in the backend folder (./data/mpglogger.mv.db),
# so your logs survive restarts, like SwiftData did on the iPad.
spring.datasource.url=jdbc:h2:file:./data/mpglogger
spring.datasource.username=sa
spring.datasource.password=

# Create/update the table from the FuelLog entity automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Return errors as RFC 9457 problem+json.
spring.mvc.problemdetails.enabled=true
