# MPG Logger on one machine: Caddy (the React app, HTTPS) in front of the Spring Boot API.
# The database stays on Neon. Step-by-step guide: HOSTING.md.
#
# The images are built on your PC and pushed to GitHub's container registry, because the VM is too
# small to build them; the VM only pulls and runs them. scripts/deploy.ps1 does all of it.
#   docker compose -f deploy/docker-compose.yml build      (on your PC, with both repos side by side)
#   docker compose -f deploy/docker-compose.yml push
#   docker compose pull && docker compose up -d            (on the VM, in ~/mpg-logger)

name: mpg-logger

# Docker keeps every container's output; cap it so logs can't fill the VM's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    image: ghcr.io/mpg-logger-app/mpg-logger-frontend:latest
    build: ../../mpg-logger-frontend
    restart: unless-stopped
    ports:
      - "80:80"       # Caddy answers on 80 only to redirect to HTTPS (and for the certificate check)
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      # The HTTPS certificate, kept so it isn't requested again on every restart.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    logging: *logging

  backend:
    image: ghcr.io/mpg-logger-app/mpg-logger-backend:latest
    build: ..
    restart: unless-stopped
    # DB_URL, DB_USERNAME and DB_PASSWORD come from .env (see .env.example). No ports are published:
    # only Caddy, on Docker's internal network, can reach the API.
    env_file:
      - path: .env
        required: false
    # The VM has 1 GB. The JVM uses 75 % of this for its heap; Caddy and the system get the rest.
    mem_limit: 600m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
