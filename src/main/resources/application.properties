spring.application.name=mpg-logger-backend

# Data is saved in a PostgreSQL database on Neon.
# Set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables, e.g.
#   DB_URL=jdbc:postgresql://<host>/<database>?sslmode=require
# The password is never stored in this file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Tables are created by db/schema.sql (see README), in the mpglogger schema.
# Hibernate only checks that they match the entities.
spring.jpa.properties.hibernate.default_schema=mpglogger
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Return errors as RFC 9457 problem+json.
spring.mvc.problemdetails.enabled=true

# When hosted behind an HTTPS proxy (Cloud Run, Netlify, a load balancer...), trust its X-Forwarded-*
# headers so the app knows the request was HTTPS and marks the session cookie Secure.
server.forward-headers-strategy=framework

# Cloud Run tells the app which port to listen on through $PORT; locally it's 8080.
server.port=${PORT:8080}

# A small connection pool: each Cloud Run instance only needs a few, and Neon's free plan
# limits connections (DB_URL uses Neon's pooler, the "-pooler" host).
spring.datasource.hikari.maximum-pool-size=5
