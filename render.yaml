# Render Blueprint: creates both halves of MPG Logger on Render. Step-by-step guide: HOSTING.md.
# Render reads this file when you create the Blueprint, and again on every push to develop.

services:
  # The Spring Boot API, built from this repo's Dockerfile. The Starter plan ($7 a month) never
  # sleeps, so there are no cold starts.
  - type: web
    name: mpg-logger-backend
    runtime: docker
    plan: starter
    region: ohio # next to the Neon database (us-east-2); can't be changed later
    branch: develop
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://ep-falling-hat-b52u8qyv-pooler.c-7.us-east-2.aws.neon.tech/mpgloggerdb?sslmode=require
      - key: DB_USERNAME
        value: mpgloggerdb_owner
      # Render asks for the password once, when the Blueprint is created; it is never in the repo.
      - key: DB_PASSWORD
        sync: false

  # The React app, built from the frontend repo and served from Render's CDN (free, always on).
  - type: web
    name: mpg-logger
    runtime: static
    repo: https://github.com/mpg-logger-app/mpg-logger-frontend
    branch: develop
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # API calls go to the backend. Render fetches them behind the scenes, so the browser only sees
      # this site's address: the app and the API share one origin and the session cookie works,
      # exactly like Vite's proxy in development. If Render gave the backend a different address
      # than mpg-logger-backend.onrender.com, put that here (HOSTING.md, step 3).
      - type: rewrite
        source: /api/*
        destination: https://mpg-logger-backend.onrender.com/api/*
      # Pages like /home and /account are handled by the React app, so every path that isn't a real
      # file gets index.html (real files such as /assets/*, /sw.js and the icons are served as they are).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Browsers check for a new version of every file each time (a quick "not modified" when nothing
      # changed), so a deploy, including a new service worker, shows up straight away. One rule only:
      # Render doesn't document which wins when two rules set the same header on a path.
      - path: /*
        name: Cache-Control
        value: no-cache
